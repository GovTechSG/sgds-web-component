<html>

<head>
  <script type="module" src="/src/index.ts"></script>
  <link href="/src/themes/day.css" rel="stylesheet" type="text/css" />
  <link href="/src/css/sgds.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <sgds-card>
    <span slot="title">Card title</span>
    <span slot="description">Card description</span>
  </sgds-card>

  <sgds-icon-card>
    <sgds-icon slot="icon" name="box-seam" size="3-xl"></sgds-icon>
    <span slot="title">Icon card title</span>
    <span slot="description">Icon card description</span>
  </sgds-icon-card>

  <sgds-image-card>
    <img slot="image" alt="Sample image" src="https://placehold.co/467x300" />
    <span slot="title">Image card title</span>
    <span slot="description">Image card description</span>
  </sgds-image-card>

  <sgds-thumbnail-card>
    <img slot="thumbnail" alt="Thumbnail" width="64" height="64" src="https://placehold.co/64x64" />
    <span slot="title">Thumbnail card title</span>
    <span slot="description">Thumbnail card description</span>
  </sgds-thumbnail-card>

  <sgds-thumbnail-card stretchedlink="">
    <img slot="thumbnail" alt="Thumbnail" width="64" height="64" src="https://placehold.co/64x64" />
    <span slot="title">Stretched thumbnail card</span>
    <p slot="description">Card with stretched link.</p>
    <sgds-link slot="footer">
      <a href="#">Stretched thumbnail card</a>
    </sgds-link>
  </sgds-thumbnail-card>
</body>

</html>

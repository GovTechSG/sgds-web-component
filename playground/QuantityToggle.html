<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height" />
    <script type="module" src="../src/index.ts"></script>
    <link href="../src/themes/day.css" rel="stylesheet" type="text/css" />
    <link href="../src/themes/night.css" rel="stylesheet" type="text/css" />
    <link href="../src/css/sgds.css" rel="stylesheet" type="text/css" />
    <style>
      .container {
        max-width: 800px;
        margin: 36px auto;
        display: flex;
        flex-direction: column;
        gap: 36px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <h2>Default</h2>
        <sgds-quantity-toggle label="Quantity"></sgds-quantity-toggle>
      </div>

      <div>
        <h2>With Step</h2>
        <sgds-quantity-toggle label="Quantity (step 5)" step="5" value="10"></sgds-quantity-toggle>
      </div>

      <div>
        <h2>With Min and Max</h2>
        <sgds-quantity-toggle label="Quantity (1–10)" min="1" max="10" value="5"></sgds-quantity-toggle>
      </div>

      <div>
        <h2>Readonly</h2>
        <sgds-quantity-toggle label="Readonly" value="3" readonly></sgds-quantity-toggle>
      </div>

      <div>
        <h2>Disabled</h2>
        <sgds-quantity-toggle label="Disabled" value="2" disabled></sgds-quantity-toggle>
      </div>

      <div>
        <h2>With Validation</h2>
        <form>
          <sgds-quantity-toggle label="Required quantity" min="3" hasFeedback="both"></sgds-quantity-toggle>
          <br />
          <sgds-button type="submit">Submit</sgds-button>
        </form>
      </div>

      <div>
        <h2>Custom Validation (noValidate)</h2>
        <form id="custom-validation-form">
          <sgds-quantity-toggle
            noValidate
            hasFeedback="both"
            label="Quantity (must be multiple of 5)"
            id="custom-qt"
            step="1"
          ></sgds-quantity-toggle>
          <br />
          <sgds-button type="submit">Submit</sgds-button>
          <sgds-button type="reset" variant="ghost">Reset</sgds-button>
        </form>
        <script>
          const customQt = document.querySelector("#custom-qt");
          const customForm = document.querySelector("#custom-validation-form");
          customQt.addEventListener("sgds-change", e => {
            if (e.target.value === 0) {
              e.target.setInvalid(false);
              return;
            }
            if (e.target.value % 5 !== 0) {
              e.target.setInvalid(true);
              e.target.invalidFeedback = "Value must be a multiple of 5";
            } else {
              e.target.setInvalid(false);
            }
          });
          customForm.addEventListener("submit", e => {
            e.preventDefault();
            if (customQt.value === 0) {
              customQt.setInvalid(true);
              customQt.invalidFeedback = "Please enter a quantity";
              return;
            }
            if (customQt.invalid) return;
            alert("Submitted: " + customQt.value);
          });
        </script>
      </div>
    </div>
  </body>
</html>

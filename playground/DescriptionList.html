<style>
</style>

<div>
  <label for="density-select">Density:</label>
  <select id="density-select">
    <option value="default">Default</option>
    <option value="compact">Compact</option>
    <option value="spacious">Spacious</option>
  </select>
  <script>
    document.getElementById('density-select').addEventListener('change', function() {
      document.getElementById('density-compact').disabled = this.value !== 'compact';
      document.getElementById('density-spacious').disabled = this.value !== 'spacious';
    });
  </script>
</div>

<h3>Title + Description + Stacked (no border)</h3>

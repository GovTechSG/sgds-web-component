<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar No Icons Playground</title>
    <script type="module" src="../src/index.ts"></script>
    <link href="../src/themes/day.css" rel="stylesheet" type="text/css" />
    <link href="../src/themes/night.css" rel="stylesheet" type="text/css" />
    <link href="../src/css/sgds.css" rel="stylesheet" type="text/css" />
    <link href="./css/utility.css" rel="stylesheet" type="text/css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      .container {
        display: flex;
        height: calc(100vh - 28px);
      }

      .sidebar-wrapper {
        height: 100%;
        position: relative;
      }

      .content {
        flex: 1;
        padding: 24px;
        overflow-y: auto;
      }

      .content h1 {
        margin-top: 0;
      }

      .example-section {
        margin-bottom: 32px;
      }

      .example-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #374151;
      }

      .example-description {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 16px;
      }
      .toggle {
        padding: 8px 16px;
        background-color: var(--sgds-surface-raised);
        border-bottom: 1px solid var(--sgds-border-default);
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .toggle-section {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .toggle-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--sgds-text-default);
        margin-right: 4px;
      }
    </style>
  </head>

  <body>
    <sgds-masthead fluid></sgds-masthead>
    <div class="container">
        <sgds-sidebar active="meetings">
          <div slot="upper">brand-name</div>

          <sgds-sidebar-section title="Main" name="main">
            <sgds-sidebar-group title="Dashboard" name="dashboard">
              <sgds-icon name="placeholder" slot="indicator" size="md"></sgds-icon>
              <sgds-sidebar-group title="Summary" name="summary">
                <sgds-sidebar-item title="Latest Sales" name="latest-sales">
                  <sgds-icon name="placeholder" slot="indicator" size="md"></sgds-icon>
                  <a href="#"></a>
                </sgds-sidebar-item>
                <sgds-sidebar-item title="Refunds" name="refunds"> </sgds-sidebar-item>
              </sgds-sidebar-group>

              <sgds-sidebar-item title="Meetings" name="meetings">
                <a href="#"></a>
              </sgds-sidebar-item>
              <sgds-sidebar-item title="Gallery" name="gallery">
                <a href="/playground/combobox.html"></a>
              </sgds-sidebar-item>
            </sgds-sidebar-group>

            <sgds-sidebar-group title="Reports" name="reports">
              <sgds-sidebar-item title="Yearly" name="yearly">
              </sgds-sidebar-item>
              <sgds-sidebar-item title="Monthly" name="monthly">
              </sgds-sidebar-item>
            </sgds-sidebar-group>

            <sgds-sidebar-item title="Public Members" name="public-members">
              <sgds-icon slot="indicator" name="summary" size="md"></sgds-icon>
            </sgds-sidebar-item>
          </sgds-sidebar-section>

          <sgds-sidebar-section title="Organization" name="organization">
            <sgds-sidebar-item
              title="Team Management Team Management Team Management Team Management"
              name="team-management"
            >
            </sgds-sidebar-item>

            <sgds-sidebar-item title="Projects" name="projects">
            </sgds-sidebar-item>
          </sgds-sidebar-section>

          <sgds-sidebar-section title="Configuration" name="configuration" collapsible>
            <sgds-sidebar-item title="Settings" name="settings">
            </sgds-sidebar-item>
          </sgds-sidebar-section>

          <sgds-sidebar-section name="support">
            <sgds-sidebar-item title="Help & Support" name="help-support">
              <span
                slot="indicator"
                class="sgds:bg-danger-surface-emphasis sgds:text-fixed-light sgds:rounded-full sgds:w-5 sgds:h-5 sgds:flex sgds:items-center sgds:justify-center sgds:text-label-xs sgds:font-semibold"
                >3</span
              >
            </sgds-sidebar-item>

            <sgds-sidebar-item title="Premium Features" name="premium-features">
              <sgds-badge slot="indicator" outlined="" variant="white">3</sgds-badge>
            </sgds-sidebar-item>
          </sgds-sidebar-section>

          <sgds-sidebar-section slot="lower">
            <sgds-sidebar-group title="Settings" name="settings-footer">
            </sgds-sidebar-group>
            <sgds-sidebar-group title="Account" name="account-footer">
            </sgds-sidebar-group>
            <sgds-sidebar-group title="Logout" name="logout">
            </sgds-sidebar-group>
          </sgds-sidebar-section>
        </sgds-sidebar>

      <div class="content">
        <h1>Sidebar No Icons Playground</h1>

        <div class="example-section">
          <div class="example-title">Overview</div>
          <div class="example-description">
            This playground demonstrates the sidebar with all <code>slot="icon"</code> elements removed.
            When collapsed, L1 items and groups should disappear entirely instead of leaving empty button spaces.
          </div>
        </div>
      </div>
    </div>
    <script>
      function handleToggle() {
        const sidebar = document.querySelector("sgds-sidebar");
        sidebar.toggleCollapsed();
      }

      function toggleTheme() {
        const isDark = document.documentElement.classList.toggle("sgds-night-theme");
        document.getElementById("theme-toggler").name = isDark ? "sun" : "moon";
      }

      function setActive(itemName) {
        const sidebar = document.querySelector("sgds-sidebar");
        if (sidebar) {
          sidebar.active = itemName;
        }
      }
    </script>
  </body>
</html>

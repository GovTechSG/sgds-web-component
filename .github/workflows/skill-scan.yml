name: Skill Scan

on:
  pull_request:
    branches:
      - master
    paths:
      - "skills/**"
  push:
    branches:
      - master
    paths:
      - "skills/**"

permissions:
  contents: read

jobs:
  skill-lint:
    name: Skill Lint (validate-skill v2.0)
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint all skills
        run: bash scripts/skill-scan/lint-skills.sh skills/

  skill-scan:
    name: Skill Scan (SkillSpector + Cisco)
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Setup scanners
        run: bash scripts/skill-scan/setup.sh

      - name: Scan changed skills
        env:
          GIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/skill-scan/scan-skills.sh skills/

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-scan-reports
          path: |
            *-nvidia-static.sarif
            *-cisco-static.sarif
            *-report-static.md
          retention-days: 14
          if-no-files-found: ignore

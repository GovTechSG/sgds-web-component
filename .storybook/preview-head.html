<script>
  // Paint the remembered colour mode before JS/CSS bundles load, to avoid a white flash on reload
  try {
    if (localStorage.getItem("sgds-sb-color-mode") === "night") {
      var d = document.documentElement;
      d.classList.add("sgds-night-theme");
      d.style.colorScheme = "dark";
      d.style.backgroundColor = "#0e0e0e";
    }
  } catch (e) {}
</script>
